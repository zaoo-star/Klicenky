<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<title>Faktury zdarma – 3Dz</title>
<meta name="description" content="Jednoduché vystavování faktur zdarma. Pro plátce i neplátce DPH, s QR platbou. Data zůstávají ve vašem zařízení.">
<meta name="theme-color" content="#ffffff">
<style>
@font-face{font-family:"Bric";font-weight:400;font-display:swap;src:url(../assets/fonts/bricolage-grotesque-latin-400-normal.woff2)format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:"Bric";font-weight:400;font-display:swap;src:url(../assets/fonts/bricolage-grotesque-latin-ext-400-normal.woff2)format("woff2");unicode-range:U+0100-02AF}
@font-face{font-family:"Bric";font-weight:700;font-display:swap;src:url(../assets/fonts/bricolage-grotesque-latin-700-normal.woff2)format("woff2");unicode-range:U+0000-00FF,U+2000-206F,U+20AC}
@font-face{font-family:"Bric";font-weight:700;font-display:swap;src:url(../assets/fonts/bricolage-grotesque-latin-ext-700-normal.woff2)format("woff2");unicode-range:U+0100-02AF}
:root{
  --bg:#ffffff; --plocha:#f3f4f7; --plocha2:#e8eaf0;
  --text:#15171d; --text2:#4a5060;
  --akcent:#d81b60; --akcent-tm:#b0144d;
  --ok:#11795a; --chyba:#b3261e;
  --r:14px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.5 "Bric",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--akcent)}
button,input,select,textarea{font:inherit;color:inherit}
.obal{max-width:880px;margin:0 auto;padding:0 20px}

/* hlavička */
header.lista{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--plocha2)}
header.lista .obal{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;text-decoration:none;color:var(--text);margin-right:auto}
.logo span{color:var(--akcent)}
nav.menu{display:flex;gap:4px}
nav.menu a{text-decoration:none;color:var(--text2);padding:8px 12px;border-radius:999px;font-weight:700;font-size:16px}
nav.menu a[aria-current="page"]{background:var(--plocha);color:var(--text)}

main{padding:28px 0 120px}
h1{font-size:30px;line-height:1.15;margin:0 0 6px;font-weight:700}
h2{font-size:21px;line-height:1.25;margin:36px 0 12px;font-weight:700}
p{margin:0 0 12px}
.pod{color:var(--text2);margin-bottom:24px}

/* tlačítka */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:999px;border:0;background:var(--plocha);color:var(--text);font-weight:700;cursor:pointer;text-decoration:none;font-size:16px}
.btn:hover{background:var(--plocha2)}
.btn.hl{background:var(--akcent);color:#fff}
.btn.hl:hover{background:var(--akcent-tm)}
.btn.mal{min-height:40px;padding:0 16px;font-size:15px}
.blok .btn:not(.hl),.polozka .btn:not(.hl):not(.nebez){background:var(--bg)}
.blok .btn:not(.hl):hover{background:var(--plocha2)}
.s-tlac .btn{min-height:48px}
.polozka .btn.nebez{background:transparent}
.btn.nebez{background:transparent;color:var(--chyba)}
.btn:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3fa0ff;outline-offset:2px}
.akce{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.plovouci{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:6;box-shadow:0 6px 20px rgba(0,0,0,.18)}

/* formuláře */
.pole{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;min-width:0}
.pole label{font-weight:700;font-size:15px}
.pole small{color:var(--text2);font-size:14px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;min-height:48px;padding:10px 14px;border-radius:12px;border:1.5px solid var(--plocha2);background:var(--bg);font-size:17px}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--text2)}
.mrizka{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.mrizka .cela{grid-column:1/-1}
.s-tlac{display:flex;gap:8px;align-items:stretch}
.s-tlac input{flex:1}
.prepinac{display:flex;gap:10px;align-items:center;min-height:48px;font-weight:700;cursor:pointer}
.prepinac input{width:22px;height:22px;accent-color:var(--akcent)}
.blok{background:var(--plocha);border-radius:var(--r);padding:20px;margin-bottom:16px}
.hlaska{padding:12px 16px;border-radius:12px;background:var(--plocha);margin:12px 0}
.hlaska.chyba{background:#fdecea;color:var(--chyba)}
.hlaska.ok{background:#e6f4ee;color:var(--ok)}

/* položky */
.polozka{background:var(--plocha);border-radius:var(--r);padding:16px;margin-bottom:12px}
.polozka .radek{display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr;gap:0 12px;align-items:end}
.polozka .radek.bezdph{grid-template-columns:1fr 1fr 1.4fr}
.polozka .spod{display:flex;justify-content:space-between;align-items:center;gap:12px}
.polozka .castka{font-weight:700;font-size:19px}
.souhrn{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px 0;border-top:2px solid var(--text);margin-top:8px;font-size:20px;font-weight:700}
.souhrn .vel{font-size:28px}

/* přehled */
.cisla{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:8px 0 28px}
.cisla div{background:var(--plocha);border-radius:var(--r);padding:16px}
.cisla b{display:block;font-size:24px;line-height:1.2}
.cisla span{color:var(--text2);font-size:15px}
.seznam{list-style:none;margin:0;padding:0}
.seznam li{border-bottom:1px solid var(--plocha2)}
.seznam a.fa{display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 4px;text-decoration:none;color:var(--text)}
.seznam .c{font-weight:700}
.seznam .k{font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.seznam .o{color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stav{text-align:right;font-size:15px;font-weight:700}
.stav.zapl{color:var(--ok)}
.stav.po{color:var(--chyba)}
.stav.ceka{color:var(--text2)}
.filtr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.filtr button{border:0;background:transparent;padding:8px 14px;border-radius:999px;font-weight:700;color:var(--text2);cursor:pointer;font-size:15px}
.filtr button[aria-pressed="true"]{background:var(--plocha);color:var(--text)}
.prazdne{padding:40px 0;color:var(--text2)}

.odb{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 4px;border-bottom:1px solid var(--plocha2)}
.odb div{min-width:0}
.odb b{display:block}
.odb span{color:var(--text2);font-size:15px}

/* papír faktury */
.papir{background:#fff;color:#111;border:1px solid var(--plocha2);border-radius:6px;padding:40px;font-size:13.5px;line-height:1.45;margin:0 auto 20px;max-width:800px}
.papir h3{margin:0;font-size:26px;letter-spacing:.02em}
.papir .hl-r{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:26px}
.papir .cis{text-align:right}
.papir .cis b{font-size:16px}
.papir .strany{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:22px}
.papir .nadp{font-size:11.5px;color:#555;font-weight:700;margin-bottom:4px}
.papir .jm{font-weight:700;font-size:15px}
.papir .udaje{display:grid;align-items:start;grid-template-columns:1fr 1fr;gap:24px;padding:14px 0;border-top:1px solid #ccc;border-bottom:1px solid #ccc;margin-bottom:20px}
.papir .udaje table td{padding:1px 12px 1px 0;vertical-align:top}
.papir .udaje table td:first-child{color:#555;white-space:nowrap}
.papir table.pol th.num{text-align:right}
.papir table.pol{width:100%;border-collapse:collapse;margin-bottom:16px}
.papir table.pol th{font-size:11.5px;color:#555;text-align:left;border-bottom:1.5px solid #111;padding:6px 6px 6px 0}
.papir table.pol td{padding:7px 6px 7px 0;border-bottom:1px solid #e3e3e3;vertical-align:top}
.papir .num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.papir .dole{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}
.papir .rekap{border-collapse:collapse;margin-left:auto}
.papir .rekap td,.papir .rekap th{padding:3px 0 3px 18px;text-align:right;font-variant-numeric:tabular-nums}
.papir .rekap th{font-size:11.5px;color:#555;font-weight:700}
.papir .celkem{font-size:20px;font-weight:700;text-align:right;margin-top:8px;padding-top:8px;border-top:1.5px solid #111}
.papir .qr{text-align:center;font-size:11px;color:#555}
.papir .qr img{width:130px;height:130px;display:block;image-rendering:pixelated}
.papir .pozn{margin-top:22px;white-space:pre-wrap}
.papir .pata{margin-top:28px;font-size:11px;color:#666}
.papir .razitko{display:inline-block;margin-top:12px;padding:4px 10px;border:2px solid #11795a;color:#11795a;font-weight:700;border-radius:4px}

@media (max-width:640px){
  body{font-size:18px}
  h1{font-size:26px}
  .mrizka{grid-template-columns:1fr}
  .cisla{grid-template-columns:1fr 1fr}
  .cisla div:last-child{grid-column:1/-1}
  .polozka .radek{grid-template-columns:1fr 1fr}
  .polozka .radek.bezdph{grid-template-columns:1fr 1fr}
  .polozka .radek.bezdph .pole:last-child{grid-column:1/-1}
  nav.menu a{padding:8px 10px;font-size:15px}
  .papir{padding:18px;font-size:12px;border-radius:0;border-left:0;border-right:0;margin:0 -20px 20px}
  .papir .strany,.papir .udaje{grid-template-columns:1fr;gap:12px}
  .papir .dole{flex-direction:column-reverse;align-items:stretch}
  .papir .qr{align-self:center}
}
.pdfrender{position:fixed;left:-10000px;top:0;width:794px;background:#fff;z-index:-1}
.pdfrender .papir{border:0;border-radius:0;margin:0;max-width:none;padding:48px 52px;font-size:13.5px}
.pdfrender .papir .strany,.pdfrender .papir .udaje{grid-template-columns:1fr 1fr;gap:24px}
.pdfrender .papir .dole{flex-direction:row;align-items:flex-start}
.pdfrender .papir .qr{align-self:auto}
@media print{
  @page{size:A4;margin:12mm}
  body{background:#fff}
  header.lista,.neTisk,.plovouci{display:none!important}
  main{padding:0}
  .obal{max-width:none;padding:0}
  .papir{border:0;padding:0;margin:0;max-width:none;font-size:12.5px}
  .papir .strany,.papir .udaje{grid-template-columns:1fr 1fr}
  .papir .dole{flex-direction:row}
  tr{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="lista">
  <div class="obal">
    <a class="logo" href="#prehled">Faktury <span>3Dz</span></a>
    <nav class="menu" aria-label="Hlavní menu">
      <a href="#prehled" data-m="prehled">Faktury</a>
      <a href="#odberatele" data-m="odberatele">Odběratelé</a>
      <a href="#nastaveni" data-m="nastaveni">Moje údaje</a>
    </nav>
  </div>
</header>
<main class="obal" id="app">
  <noscript><p>Aplikace potřebuje zapnutý JavaScript.</p></noscript>
</main>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
"use strict";
/* ===== Úložiště: vše jen v prohlížeči uživatele ===== */
const KLIC = "3dz-faktury-v1";
const VYCHOZI = () => ({
  verze: 1,
  nastaveni: {jmeno:"",ulice:"",mesto:"",psc:"",ico:"",dic:"",platce:false,
    rejstrik:"Fyzická osoba zapsaná v živnostenském rejstříku.",
    ucet:"",iban:"",email:"",telefon:"",splatnost:14,poznamka:""},
  odberatele: [],
  faktury: []
});
let D;
function nacti(){
  try{
    const s = JSON.parse(localStorage.getItem(KLIC) || "null");
    D = s && s.verze ? s : VYCHOZI();
    D.nastaveni = Object.assign(VYCHOZI().nastaveni, D.nastaveni || {});
    D.odberatele = Array.isArray(D.odberatele) ? D.odberatele : [];
    D.faktury = Array.isArray(D.faktury) ? D.faktury : [];
  }catch(e){ D = VYCHOZI(); }
}
function uloz(){
  try{ localStorage.setItem(KLIC, JSON.stringify(D)); return true; }
  catch(e){ alert("Nepodařilo se uložit data (plné úložiště prohlížeče?). Stáhněte si zálohu."); return false; }
}
nacti();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

/* ===== Pomocné funkce ===== */
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((Number(n) + Number.EPSILON) * 100) / 100;
const cislo = v => { const n = parseFloat(String(v ?? "").replace(/\s/g,"").replace(",", ".")); return isFinite(n) ? n : 0; };
const kc = n => new Intl.NumberFormat("cs-CZ",{style:"currency",currency:"CZK"}).format(r2(n));
const num = (n, d=2) => new Intl.NumberFormat("cs-CZ",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n);
const mn = n => new Intl.NumberFormat("cs-CZ",{maximumFractionDigits:3}).format(n);
const dnes = () => { const d = new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const plusDni = (iso, n) => { const d = new Date(iso+"T12:00:00"); d.setDate(d.getDate()+Number(n||0)); return d.toISOString().slice(0,10); };
const datum = iso => { if(!iso) return "–"; const [y,m,d] = iso.split("-"); return `${+d}. ${+m}. ${y}`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const bezDiakritiky = s => String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"");

/* ===== Účet → IBAN, kontrola čísla účtu ===== */
function mod97(s){ let r = 0; for (const ch of s) r = (r*10 + (+ch)) % 97; return r; }
function kontrolaUctu(cast, vahy){
  const c = cast.padStart(vahy.length,"0"); let s = 0;
  for (let i=0;i<vahy.length;i++) s += (+c[i]) * vahy[i];
  return s % 11 === 0;
}
function ucetNaIban(ucet){
  const m = String(ucet||"").replace(/\s/g,"").match(/^(?:(\d{1,6})-)?(\d{2,10})\/(\d{4})$/);
  if (!m) return {chyba:"Číslo účtu zadejte ve tvaru 123456789/0800 nebo 19-123456789/0800."};
  const pred = m[1] || "", c = m[2], banka = m[3];
  if (pred && !kontrolaUctu(pred,[10,5,8,4,2,1])) return {chyba:"Předčíslí účtu nevychází, zkontrolujte ho."};
  if (!kontrolaUctu(c,[6,3,7,9,10,5,8,4,2,1])) return {chyba:"Číslo účtu nevychází podle kontrolního součtu, zkontrolujte ho."};
  const bban = banka + pred.padStart(6,"0") + c.padStart(10,"0");
  const kont = String(98 - mod97(bban + "123500")).padStart(2,"0");
  return {iban: "CZ" + kont + bban};
}
function ibanPlatny(iban){
  const s = String(iban||"").replace(/\s/g,"").toUpperCase();
  if (!/^[A-Z]{2}\d{2}[A-Z0-9]{10,30}$/.test(s)) return false;
  const p = (s.slice(4)+s.slice(0,4)).replace(/[A-Z]/g, ch => String(ch.charCodeAt(0)-55));
  return mod97(p) === 1;
}
const ibanHezky = i => String(i||"").replace(/\s/g,"").replace(/(.{4})/g,"$1 ").trim();

/* ===== QR Platba (formát SPAYD) ===== */
function qrPlatba(f){
  const iban = String(f.dod.iban||"").replace(/\s/g,"").toUpperCase();
  if (!iban || !ibanPlatny(iban) || typeof qrcode !== "function") return "";
  const vs = String(f.cislo).replace(/\D/g,"").slice(-10);
  const msg = bezDiakritiky("Faktura " + f.cislo).replace(/[*]/g,"").slice(0,60);
  let s = `SPD*1.0*ACC:${iban}*AM:${r2(soucty(f).celkem).toFixed(2)}*CC:CZK`;
  if (f.splatnost) s += `*DT:${f.splatnost.replace(/-/g,"")}`;
  if (vs) s += `*X-VS:${vs}`;
  s += `*MSG:${msg}`;
  try{ const q = qrcode(0,"M"); q.addData(s); q.make(); return q.createDataURL(8,0); }catch(e){ return ""; }
}

/* ===== Výpočty ===== */
function soucty(f){
  const sazby = {}; let zaklad = 0, dph = 0;
  for (const p of f.polozky){
    const z = r2(cislo(p.mnozstvi) * cislo(p.cena));
    zaklad += z;
    if (f.dod.platce){ const s = String(p.dph ?? 21); sazby[s] = r2((sazby[s]||0) + z); }
  }
  const rek = [];
  if (f.dod.platce){
    for (const s of Object.keys(sazby).sort((a,b)=>b-a)){
      const d = r2(sazby[s] * Number(s) / 100); dph += d;
      rek.push({sazba:Number(s), zaklad:sazby[s], dph:d});
    }
  }
  return {zaklad:r2(zaklad), dph:r2(dph), celkem:r2(zaklad+dph), rek};
}
function dalsiCislo(){
  const rok = String(new Date().getFullYear()); let max = 0;
  for (const f of D.faktury){ const m = String(f.cislo).match(new RegExp("^"+rok+"(\\d{3,})$")); if (m) max = Math.max(max, +m[1]); }
  return rok + String(max+1).padStart(3,"0");
}
function stav(f){
  if (f.zaplaceno) return {t:"Zaplaceno " + datum(f.zaplaceno), c:"zapl", k:"zapl"};
  if (f.splatnost && f.splatnost < dnes()) return {t:"Po splatnosti", c:"po", k:"ceka"};
  return {t:"Čeká na platbu", c:"ceka", k:"ceka"};
}
const adresa = o => [o.ulice, [o.psc,o.mesto].filter(Boolean).join(" ")].filter(Boolean);
const udajeVyplnene = () => D.nastaveni.jmeno && D.nastaveni.ico;

/* ===== ARES (veřejný registr firem) ===== */
async function ares(ico){
  ico = String(ico||"").replace(/\D/g,"");
  if (!/^\d{8}$/.test(ico)) throw new Error("IČO musí mít 8 číslic.");
  let r;
  try{ r = await fetch(`https://ares.gov.cz/ekonomicke-subjekty-v-be/rest/ekonomicke-subjekty/${ico}`, {headers:{Accept:"application/json"}}); }
  catch(e){ throw new Error("Registr ARES teď nejde načíst. Vyplňte údaje ručně."); }
  if (r.status === 404) throw new Error("Firma s tímto IČO v ARES není.");
  if (!r.ok) throw new Error("ARES odpověděl chybou. Vyplňte údaje ručně.");
  const j = await r.json(); const s = j.sidlo || {};
  let ulice = "";
  if (s.nazevUlice || s.nazevObce){
    const cd = [s.cisloDomovni, s.cisloOrientacni].filter(Boolean).join("/");
    ulice = s.nazevUlice ? `${s.nazevUlice} ${cd}` : (s.nazevCastiObce ? `${s.nazevCastiObce} ${cd}` : cd);
  }
  return {
    jmeno: j.obchodniJmeno || "",
    ulice: ulice.trim() || (s.textovaAdresa || "").split(",")[0] || "",
    mesto: s.nazevObce || "",
    psc: s.psc ? String(s.psc).replace(/^(\d{3})(\d{2})$/,"$1 $2") : "",
    ico, dic: j.dic || ""
  };
}

/* ===== Router ===== */
function jdi(h){ location.hash = h; }
window.addEventListener("hashchange", vykresli);
function vykresli(){
  const h = location.hash.slice(1) || "prehled";
  const [cesta, id] = h.split("/");
  $$("nav.menu a").forEach(a => a.toggleAttribute("aria-current", false));
  const m = ["prehled","nova","upravit","faktura"].includes(cesta) ? "prehled" : cesta;
  const a = $(`nav.menu a[data-m="${m}"]`); if (a) a.setAttribute("aria-current","page");
  const app = $("#app");
  if (!udajeVyplnene() && cesta !== "nastaveni" && cesta !== "o-aplikaci"){ obrNastaveni(app, true); return; }
  if (cesta === "nastaveni") obrNastaveni(app, false);
  else if (cesta === "odberatele") obrOdberatele(app);
  else if (cesta === "nova") obrEditor(app, null);
  else if (cesta === "upravit") obrEditor(app, id);
  else if (cesta === "faktura") obrFaktura(app, id);
  else if (cesta === "o-aplikaci") obrInfo(app);
  else obrPrehled(app);
  window.scrollTo(0,0);
}

/* ===== Přehled faktur ===== */
let filtr = "vse";
function obrPrehled(app){
  const rok = String(new Date().getFullYear());
  const fs = [...D.faktury].sort((a,b) => (b.vystaveno||"").localeCompare(a.vystaveno||"") || String(b.cislo).localeCompare(String(a.cislo)));
  const nezapl = fs.filter(f => !f.zaplaceno);
  const po = nezapl.filter(f => f.splatnost && f.splatnost < dnes());
  const zaplLetos = fs.filter(f => f.zaplaceno && f.zaplaceno.startsWith(rok)).reduce((s,f)=>s+soucty(f).celkem,0);
  const vybr = filtr === "ceka" ? nezapl : filtr === "zapl" ? fs.filter(f=>f.zaplaceno) : fs;
  app.innerHTML = `
    <h1>Faktury</h1>
    <p class="pod">Vystavujte faktury zdarma. Všechno zůstává jen v tomto zařízení.</p>
    <div class="cisla">
      <div><b>${kc(nezapl.reduce((s,f)=>s+soucty(f).celkem,0))}</b><span>Čeká na zaplacení (${nezapl.length})</span></div>
      <div><b>${kc(po.reduce((s,f)=>s+soucty(f).celkem,0))}</b><span>Po splatnosti (${po.length})</span></div>
      <div><b>${kc(zaplLetos)}</b><span>Zaplaceno v roce ${rok}</span></div>
    </div>
    ${fs.length ? `
    <div class="filtr" role="group" aria-label="Filtr faktur">
      <button data-f="vse" aria-pressed="${filtr==="vse"}">Všechny</button>
      <button data-f="ceka" aria-pressed="${filtr==="ceka"}">Nezaplacené</button>
      <button data-f="zapl" aria-pressed="${filtr==="zapl"}">Zaplacené</button>
    </div>
    <ul class="seznam">${vybr.map(f => { const st = stav(f); return `
      <li><a class="fa" href="#faktura/${esc(f.id)}">
        <span class="c">${esc(f.cislo)}</span><span class="k">${kc(soucty(f).celkem)}</span>
        <span class="o">${esc(f.odb.jmeno || "Bez odběratele")} · ${datum(f.vystaveno)}</span><span class="stav ${st.c}">${esc(st.t)}</span>
      </a></li>`;}).join("") || `<li class="prazdne">Tady nic není.</li>`}</ul>`
    : `<div class="prazdne"><p>Zatím žádná faktura.</p></div>`}
    <a class="btn hl plovouci" href="#nova">Vystavit fakturu</a>
    <p class="neTisk" style="margin-top:40px;color:var(--text2);font-size:15px">Data jsou uložená jen v tomto prohlížeči. <a href="#nastaveni">Stáhněte si zálohu</a>, ať o ně nepřijdete. <a href="#o-aplikaci">Jak to funguje</a></p>`;
  $$(".filtr button", app).forEach(b => b.onclick = () => { filtr = b.dataset.f; obrPrehled(app); });
}

          <small>Živnostník: „Fyzická osoba zapsaná v živnostenském rejstříku.“ Firma: soud, oddíl a vložka z obchodního rejstříku.</small></div>

        <label class="prepinac"><input type="checkbox" id="n-platce" name="platce" ${n.platce?"checked":""}> Jsem plátce DPH</label>
        <div class="pole" id="n-dic-p" ${n.platce?"":"hidden"}><label for="n-dic">DIČ</label><input type="text" id="n-dic" name="dic" value="${esc(n.dic)}" placeholder="CZ12345678"></div>
      </div>

    ${uvod ? "" : `

    <p>Faktury jsou jen v tomto prohlížeči. Když ho vymažete nebo změníte telefon, bez zálohy o ně přijdete. Zálohu si stáhněte třeba jednou měsíčně.</p>
    <div class="akce">
      <button class="btn" id="z-stahnout" type="button">Stáhnout zálohu</button>
      <label class="btn" for="z-soubor">Nahrát zálohu</label>
      <input type="file" id="z-soubor" accept="application/json,.json" hidden>
    </div>
    <div id="z-h"></div>`}`;
  const f = $("#fn");
  $("#n-platce").onchange = e => { $("#n-dic-p").hidden = !e.target.checked; };
  $("#n-ucet").onchange = () => {
    const v = $("#n-ucet").value.trim(); if (!v) return;
    const r = ucetNaIban(v);
    if (r.iban) { $("#n-iban").value = ibanHezky(r.iban); $("#n-h").innerHTML = ""; }
    else $("#n-h").innerHTML = `<div class="hlaska chyba">${esc(r.chyba)}</div>`;
  };
  $("#n-ares").onclick = async () => {
    const b = $("#n-ares"), h = $("#n-ares-h"); b.disabled = true; b.textContent = "Načítám…";
    try{
      const a = await ares($("#n-ico").value);
      for (const k of ["jmeno","ulice","psc","mesto"]) if (a[k]) f.elements[k].value = a[k];
      if (a.dic){ f.elements.dic.value = a.dic; }
      h.innerHTML = `<div class="hlaska ok">Načteno z ARES. Zkontrolujte prosím údaje.</div>`;
    }catch(e){ h.innerHTML = `<div class="hlaska chyba">${esc(e.message)}</div>`; }
    b.disabled = false; b.textContent = "Načíst z ARES";
  };
  f.onsubmit = e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(f));
    const chyby = [];
    if (!v.jmeno.trim()) chyby.push("Vyplňte jméno nebo název.");
    if (!/^\d{8}$/.test(v.ico.replace(/\D/g,""))) chyby.push("IČO musí mít 8 číslic.");
    const iban = v.iban.replace(/\s/g,"").toUpperCase();
    if (iban && !ibanPlatny(iban)) chyby.push("IBAN nevychází, zkontrolujte ho.");
    if (v.ucet.trim() && !iban){ const r = ucetNaIban(v.ucet); if (r.chyba) chyby.push(r.chyba); }
    if (chyby.length){ $("#n-h").innerHTML = `<div class="hlaska chyba">${chyby.map(esc).join("<br>")}</div>`; return; }
    let ib = iban; if (!ib && v.ucet.trim()) ib = ucetNaIban(v.ucet).iban || "";
    Object.assign(D.nastaveni, {
      jmeno:v.jmeno.trim(), ulice:v.ulice.trim(), psc:v.psc.trim(), mesto:v.mesto.trim(), ico:v.ico.replace(/\D/g,""),
      rejstrik:v.rejstrik.trim(), platce:!!v.platce, dic:v.platce ? v.dic.replace(/\s/g,"").toUpperCase() : "",
      ucet:v.ucet.trim(), iban:ib, email:v.email.trim(), telefon:v.telefon.trim(),
      splatnost:Math.max(0, Math.min(365, parseInt(v.splatnost)||0)), poznamka:v.poznamka
    });
    if (uloz()){
      if (uvod) jdi("#nova");
      else $("#n-h").innerHTML = `<div class="hlaska ok">Uloženo.</div>`;
    }
  };
  if (!uvod){
    $("#z-stahnout").onclick = () => {
      const blob = new Blob([JSON.stringify(D, null, 1)], {type:"application/json"});
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `faktury-zaloha-${dnes()}.json`; document.body.appendChild(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    };
    $("#z-soubor").onchange = async e => {
      const s = e.target.files[0]; if (!s) return;
      try{
        const j = JSON.parse(await s.text());
        if (!j || !j.verze || !Array.isArray(j.faktury)) throw new Error();
        if (!confirm(`Záloha obsahuje ${j.faktury.length} faktur. Nahradit současná data zálohou?`)) return;
        localStorage.setItem(KLIC, JSON.stringify(j)); nacti();
        $("#z-h").innerHTML = `<div class="hlaska ok">Záloha nahrána.</div>`;
      }catch(_){ $("#z-h").innerHTML = `<div class="hlaska chyba">Tohle není platná záloha faktur.</div>`; }
      e.target.value = "";
    };
  }
}

      </div>
    </form>`;

  const pol = $("#e-pol");
  function polozkaHTML(p, i){
    return `<div class="polozka" data-i="${i}">

        ${f.polozky.length > 1 ? `<button type="button" class="btn mal nebez" data-pryc aria-label="Odebrat položku ${i+1}">Odebrat</button>` : ""}</div>
    </div>`;
  }
  function prepocet(){
    $$(".polozka", pol).forEach(el => {
      const p = f.polozky[+el.dataset.i];
      const z = r2(cislo(p.mnozstvi)*cislo(p.cena));
      $("[data-castka]", el).textContent = platce ? `${kc(z)} bez DPH` : kc(z);

    $("#e-souhrn").innerHTML = `<span>Celkem k úhradě${platce ? ` <small style="font-weight:400;font-size:15px;color:var(--text2)">(DPH ${kc(s.dph)})</small>` : ""}</span><span class="vel">${kc(s.celkem)}</span>`;
  }
  function polozky(){
    pol.innerHTML = f.polozky.map(polozkaHTML).join("");
    $$(".polozka", pol).forEach(el => {
      const i = +el.dataset.i;
      $$("[data-k]", el).forEach(inp => inp.addEventListener("input", () => { f.polozky[i][inp.dataset.k] = inp.value; prepocet(); }));
      const b = $("[data-pryc]", el); if (b) b.onclick = () => { f.polozky.splice(i,1); polozky(); };

    f.polozky.push({popis:"",mnozstvi:1,jednotka:"ks",cena:"",dph:21}); polozky();

  };
  $("#e-ares").onclick = async () => {

      const a = await ares($("#e-ico").value);
      for (const k in odbPole) if (a[k]) $(odbPole[k]).value = a[k];

  $("#e-vyst").onchange = () => { if (!puvodni) $("#e-spl").value = plusDni($("#e-vyst").value, n.splatnost); };

  $("#fe").onsubmit = e => {
    e.preventDefault();
    for (const k in odbPole) f.odb[k] = $(odbPole[k]).value.trim();
    f.odb.ico = f.odb.ico.replace(/\D/g,""); f.odb.email = f.odb.email || ""; f.odb.dic = f.odb.dic.replace(/\s/g,"").toUpperCase();
    f.cislo = $("#e-cislo").value.trim(); f.uhrada = $("#e-uhrada").value;
    f.vystaveno = $("#e-vyst").value; f.splatnost = $("#e-spl").value; f.duzp = $("#e-duzp").value;
    f.poznamka = $("#e-poz").value;
    f.polozky = f.polozky.filter(p => p.popis.trim() || cislo(p.cena));
    const ch = [];
    if (!f.odb.jmeno) ch.push("Vyplňte jméno odběratele.");
    if (f.odb.ico && !/^\d{8}$/.test(f.odb.ico)) ch.push("IČO odběratele musí mít 8 číslic.");
    if (f.odb.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.odb.email)) ch.push("E-mail odběratele nevypadá správně.");
    if (!f.cislo) ch.push("Vyplňte číslo faktury.");
    if (D.faktury.some(x => x.id !== f.id && String(x.cislo) === f.cislo)) ch.push("Faktura s tímto číslem už existuje. Čísla faktur se nesmí opakovat.");
    if (!f.vystaveno) ch.push("Vyplňte datum vystavení.");
    if (!f.polozky.length) ch.push("Přidejte aspoň jednu položku s popisem a cenou.");
    if (f.polozky.some(p => !p.popis.trim())) ch.push("Každá položka potřebuje popis.");
    if (f.polozky.some(p => cislo(p.mnozstvi) <= 0)) ch.push("Množství musí být větší než nula.");
    if (ch.length){
      if (!f.polozky.length) f.polozky.push({popis:"",mnozstvi:1,jednotka:"ks",cena:"",dph:21});
      polozky();
      $("#e-h").innerHTML = `<div class="hlaska chyba">${ch.map(esc).join("<br>")}</div>`;
      $("#e-h").scrollIntoView({block:"center"}); return;
    }
    f.polozky = f.polozky.map(p => ({popis:p.popis.trim(), mnozstvi:cislo(p.mnozstvi), jednotka:String(p.jednotka||"").trim(), cena:cislo(p.cena), dph: platce ? Number(p.dph) : 0}));
    f.dod = dod;
    if ($("#e-ulozit").checked){
      const ex = D.odberatele.find(o => (f.odb.ico && o.ico === f.odb.ico) || (!f.odb.ico && o.jmeno === f.odb.jmeno));
      if (ex) Object.assign(ex, f.odb); else D.odberatele.push({id:uid(), ...f.odb});
    }
    if (puvodni) Object.assign(puvodni, f); else D.faktury.push(f);
    if (uloz()) jdi("#faktura/" + f.id);
  };
}

/* ===== Detail a tisk faktury ===== */
function papirHTML(f){
  const s = soucty(f), d = f.dod, platce = !!d.platce;
  const qr = f.uhrada === "prevod" ? qrPlatba(f) : "";
  const vs = String(f.cislo).replace(/\D/g,"").slice(-10);
  const uh = {prevod:"Převodem na účet", hotove:"V hotovosti", karta:"Kartou"}[f.uhrada] || "";
  return `<article class="papir" aria-label="Náhled faktury">
    <div class="hl-r"><h3>${platce ? "Faktura – daňový doklad" : "Faktura"}</h3><div class="cis">číslo<br><b>${esc(f.cislo)}</b></div></div>
    <div class="strany">
      <div><div class="nadp">DODAVATEL</div><div class="jm">${esc(d.jmeno)}</div>
        ${adresa(d).map(esc).join("<br>")}<br>IČO: ${esc(d.ico)}${d.dic ? `<br>DIČ: ${esc(d.dic)}` : ""}
        <br>${platce ? "Plátce DPH" : "Neplátce DPH"}
        ${d.rejstrik ? `<br><span style="color:#555">${esc(d.rejstrik)}</span>` : ""}
        ${d.email || d.telefon ? `<br>${esc([d.email,d.telefon].filter(Boolean).join(" · "))}` : ""}</div>
      <div><div class="nadp">ODBĚRATEL</div><div class="jm">${esc(f.odb.jmeno)}</div>
        ${adresa(f.odb).map(esc).join("<br>")}${f.odb.ico ? `<br>IČO: ${esc(f.odb.ico)}` : ""}${f.odb.dic ? `<br>DIČ: ${esc(f.odb.dic)}` : ""}</div>
    </div>
    <div class="udaje">
      <table><tbody>
        <tr><td>Datum vystavení</td><td>${datum(f.vystaveno)}</td></tr>
        ${platce || (f.duzp && f.duzp !== f.vystaveno) ? `<tr><td>${platce ? "Datum usk. plnění" : "Datum dodání"}</td><td>${datum(f.duzp)}</td></tr>` : ""}
        <tr><td>Datum splatnosti</td><td>${datum(f.splatnost)}</td></tr>
      </tbody></table>
      <table><tbody>
        <tr><td>Způsob úhrady</td><td>${esc(uh)}</td></tr>
        ${f.uhrada === "prevod" && d.ucet ? `<tr><td>Číslo účtu</td><td><b>${esc(d.ucet)}</b></td></tr>` : ""}
        ${f.uhrada === "prevod" && d.iban ? `<tr><td>IBAN</td><td style="white-space:nowrap">${esc(ibanHezky(d.iban))}</td></tr>` : ""}
        ${f.uhrada === "prevod" && vs ? `<tr><td>Variabilní symbol</td><td><b>${esc(vs)}</b></td></tr>` : ""}
      </tbody></table>
    </div>
    <table class="pol">
      <thead><tr><th>Popis</th><th class="num">Množství</th><th class="num">Cena/j.${platce?" bez DPH":""}</th>${platce?`<th class="num">DPH</th>`:""}<th class="num">Celkem${platce?" bez DPH":""}</th></tr></thead>
      <tbody>${f.polozky.map(p => `<tr><td>${esc(p.popis)}</td><td class="num">${mn(p.mnozstvi)} ${esc(p.jednotka)}</td><td class="num">${num(p.cena)}</td>${platce?`<td class="num">${p.dph} %</td>`:""}<td class="num">${num(r2(p.mnozstvi*p.cena))}</td></tr>`).join("")}</tbody>
    </table>
    <div class="dole">
      ${qr ? `<div class="qr"><img src="${qr}" alt="QR kód pro platbu">QR Platba</div>` : "<div></div>"}
      <div>
        ${platce ? `<table class="rekap"><thead><tr><th>Sazba</th><th>Základ</th><th>DPH</th><th>Celkem</th></tr></thead><tbody>
          ${s.rek.map(r => `<tr><td>${r.sazba} %</td><td>${num(r.zaklad)}</td><td>${num(r.dph)}</td><td>${num(r2(r.zaklad+r.dph))}</td></tr>`).join("")}
          </tbody></table>` : ""}
        <div class="celkem">Celkem k úhradě: ${kc(s.celkem)}</div>
        ${f.zaplaceno ? `<div style="text-align:right"><span class="razitko">ZAPLACENO ${datum(f.zaplaceno)}</span></div>` : ""}
      </div>
    </div>
    ${f.poznamka ? `<div class="pozn">${esc(f.poznamka)}</div>` : ""}
    ${!platce ? `<div class="pata">Dodavatel není plátcem DPH.</div>` : ""}
  </article>`;
}
function obrFaktura(app, id){
  const f = D.faktury.find(x => x.id === id);
  if (!f){ app.innerHTML = `<h1>Faktura nenalezena</h1><a class="btn" href="#prehled">Zpět na faktury</a>`; return; }
  const st = stav(f);
  app.innerHTML = `
    <div class="neTisk">
      <p style="margin:0"><a href="#prehled">← Všechny faktury</a></p>
      <h1 style="margin-top:12px">Faktura ${esc(f.cislo)}</h1>
      <p class="pod"><span class="stav ${st.c}" style="text-align:left">${esc(st.t)}</span> · ${esc(f.odb.jmeno)} · ${kc(soucty(f).celkem)}</p>
      <div class="akce" style="margin:0 0 24px">
        <button class="btn hl" id="d-pdf" type="button">Stáhnout PDF</button>
        <button class="btn" id="d-poslat" type="button">${MUZE_SDILET ? "Poslat" : "Poslat e-mailem"}</button>
        ${f.zaplaceno ? `<button class="btn" id="d-nezapl" type="button">Zrušit zaplacení</button>`
          : `<button class="btn" id="d-zapl" type="button">Označit jako zaplacenou</button>`}
      </div>
      <div id="d-h"></div>
      <div id="d-zapl-box" hidden class="blok">
        <div class="pole"><label for="d-zapl-dat">Datum zaplacení</label><input type="date" id="d-zapl-dat" value="${dnes()}"></div>
        <button class="btn hl mal" id="d-zapl-ok" type="button">Potvrdit</button>
      </div>
    </div>
    ${papirHTML(f)}
    <div class="akce neTisk">
      <a class="btn" href="#upravit/${esc(f.id)}">Upravit</a>
      <button class="btn" id="d-tisk" type="button">Vytisknout</button>
      <button class="btn" id="d-kopie" type="button">Vystavit podobnou</button>
      <button class="btn nebez" id="d-smaz" type="button">Smazat</button>
    </div>
`;
  pripravPdf(f);
  $("#d-pdf").onclick = async () => {
    const b = $("#d-pdf"); b.disabled = true; b.textContent = "Připravuji PDF…";
    try{ const s = await pdfSoubor(f); stahni(s); }
    catch(e){ $("#d-h").innerHTML = `<div class="hlaska chyba">${esc(e.message)}</div>`; }
    b.disabled = false; b.textContent = "Stáhnout PDF";
  };
  $("#d-poslat").onclick = () => poslat(f);
  $("#d-tisk").onclick = () => {
    const t = document.title; document.title = "Faktura " + f.cislo;
    window.print(); setTimeout(() => document.title = t, 500);
  };
  const z = $("#d-zapl");
  if (z) z.onclick = () => { $("#d-zapl-box").hidden = false; $("#d-zapl-dat").focus(); };
  const zok = $("#d-zapl-ok");
  if (zok) zok.onclick = () => { f.zaplaceno = $("#d-zapl-dat").value || dnes(); uloz(); obrFaktura(app, id); };
  const nz = $("#d-nezapl");
  if (nz) nz.onclick = () => { f.zaplaceno = null; uloz(); obrFaktura(app, id); };
  $("#d-kopie").onclick = () => {
    const n = D.nastaveni;
    const k = JSON.parse(JSON.stringify(f));
    Object.assign(k, {id:uid(), cislo:dalsiCislo(), vystaveno:dnes(), duzp:dnes(), splatnost:plusDni(dnes(), n.splatnost), zaplaceno:null, dod:JSON.parse(JSON.stringify(n))});
    if (!n.platce) k.polozky.forEach(p => p.dph = 0); else k.polozky.forEach(p => { if (!p.dph && p.dph !== 0) p.dph = 21; });
    predloha = k; jdi("#nova");
  };
  $("#d-smaz").onclick = () => {
    if (confirm(`Opravdu smazat fakturu ${f.cislo}? Vystavenou fakturu, kterou už odběratel dostal, nemažte – vystavte místo toho opravný doklad.`)){
      D.faktury = D.faktury.filter(x => x.id !== f.id); uloz(); jdi("#prehled");
    }
  };
}

/* ===== PDF a odeslání ===== */
const MUZE_SDILET = !!(navigator.canShare && window.File && (() => { try{ return navigator.canShare({files:[new File(["x"],"x.pdf",{type:"application/pdf"})]}); }catch(e){ return false; } })());
const KNIHOVNY = {
  html2canvas: "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js",
  jspdf: "https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js"
};
const nactene = {};
function skript(url){
  return nactene[url] ||= new Promise((ok, ko) => {
    const s = document.createElement("script"); s.src = url; s.onload = ok;
    s.onerror = () => { delete nactene[url]; ko(new Error("Nepodařilo se načíst nástroj na PDF. Zkontrolujte připojení k internetu.")); };
    document.head.appendChild(s);
  });
}
const nazevPdf = f => "Faktura-" + bezDiakritiky(f.cislo).replace(/[^\w.-]+/g,"-") + ".pdf";
let pdfCache = {klic:"", soubor:null, slib:null};
async function vyrobPdf(f){
  await Promise.all([skript(KNIHOVNY.html2canvas), skript(KNIHOVNY.jspdf)]);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const box = document.createElement("div"); box.className = "pdfrender"; box.setAttribute("aria-hidden","true");
  box.innerHTML = papirHTML(f); document.body.appendChild(box);
  try{
    await Promise.all($$("img", box).map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const canvas = await html2canvas(box.firstElementChild, {scale:2, backgroundColor:"#ffffff", logging:false, useCORS:true});
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({unit:"mm", format:"a4", compress:true});
    const sirka = 210, vyskaStr = 297;
    const pxNaMm = canvas.width / sirka, vyskaPx = Math.floor(vyskaStr * pxNaMm);
    for (let y = 0, i = 0; y < canvas.height; y += vyskaPx, i++){
      const h = Math.min(vyskaPx, canvas.height - y);
      const c = document.createElement("canvas"); c.width = canvas.width; c.height = h;
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0,0,c.width,h);
      ctx.drawImage(canvas, 0, y, canvas.width, h, 0, 0, canvas.width, h);
      if (i) pdf.addPage();
      pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, sirka, h / pxNaMm);
    }
    pdf.setProperties({title: "Faktura " + f.cislo, author: f.dod.jmeno || ""});
    return new File([pdf.output("blob")], nazevPdf(f), {type:"application/pdf"});
  } finally { box.remove(); }
}
function pdfSoubor(f){
  const klic = JSON.stringify(f);
  if (pdfCache.klic !== klic){ pdfCache = {klic, soubor:null, slib:null}; }
  if (pdfCache.soubor) return Promise.resolve(pdfCache.soubor);
  if (!pdfCache.slib){
    const c = pdfCache;
    c.slib = vyrobPdf(f).then(s => (c.soubor = s)).catch(e => { c.slib = null; throw e; });
  }
  return pdfCache.slib;
}
// PDF připravíme hned po otevření faktury, aby sdílení šlo spustit přímo z kliknutí (iPhone to vyžaduje).
function pripravPdf(f){ pdfSoubor(f).catch(() => {}); }
function stahni(soubor){
  const a = document.createElement("a"); a.href = URL.createObjectURL(soubor); a.download = soubor.name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
function textMailu(f){
  const s = soucty(f), d = f.dod, vs = String(f.cislo).replace(/\D/g,"").slice(-10);
  const r = [`Dobrý den,`, ``, `v příloze posílám fakturu č. ${f.cislo} na částku ${kc(s.celkem)}.`];
  if (!f.zaplaceno && f.uhrada === "prevod" && d.ucet) r.push(`Prosím o úhradu na účet ${d.ucet}${vs ? `, variabilní symbol ${vs}` : ""}${f.splatnost ? `, do ${datum(f.splatnost)}` : ""}.`);
  r.push(``, `Děkuji a přeji hezký den`, d.jmeno);
  return r.join("\n");
}
async function poslat(f){
  const h = $("#d-h"), b = $("#d-poslat");
  const predmet = `Faktura ${f.cislo}`;
  if (MUZE_SDILET){
    if (!pdfCache.soubor || pdfCache.klic !== JSON.stringify(f)){
      b.disabled = true; b.textContent = "Připravuji PDF…";
      try{ await pdfSoubor(f); }catch(e){ h.innerHTML = `<div class="hlaska chyba">${esc(e.message)}</div>`; b.disabled = false; b.textContent = "Poslat"; return; }
      b.disabled = false; b.textContent = "Poslat";
      h.innerHTML = `<div class="hlaska">PDF je připravené. Klikněte znovu na „Poslat“.</div>`;
      return;
    }
    try{
      await navigator.share({files:[pdfCache.soubor], title:predmet, text:textMailu(f)});
      h.innerHTML = "";
      return;
    }catch(e){
      if (e && e.name === "AbortError") return; // uživatel sdílení zavřel
      // jinak spadneme na e-mail níže
    }
  }
  b.disabled = true; b.textContent = "Připravuji PDF…";
  try{
    const s = await pdfSoubor(f); stahni(s);
    const odkaz = `mailto:${encodeURIComponent(f.odb.email || "").replace(/%40/g,"@")}?subject=${encodeURIComponent(predmet)}&body=${encodeURIComponent(textMailu(f))}`;
    h.innerHTML = `<div class="hlaska ok">PDF <b>${esc(s.name)}</b> se stáhlo. Otevírám e-mail – fakturu do něj přiložte ze složky Stažené soubory.
      <br><a href="${esc(odkaz)}">Otevřít e-mail znovu</a></div>`;
    location.href = odkaz;
  }catch(e){ h.innerHTML = `<div class="hlaska chyba">${esc(e.message)}</div>`; }
  b.disabled = false; b.textContent = MUZE_SDILET ? "Poslat" : "Poslat e-mailem";
}
